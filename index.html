<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姓名测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    padding: 40px 32px;
    width: 100%;
    max-width: 520px;
    text-align: center;
  }
  h1 { font-size: 26px; color: #333; margin-bottom: 8px; }
  p.tip { color: #888; margin-bottom: 28px; font-size: 15px; }
  input {
    width: 100%;
    padding: 14px 18px;
    font-size: 17px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: #764ba2; }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(118,75,162,.4); }
  button:active { transform: translateY(0); }

  .result { display: none; margin-top: 28px; }
  .result.show { display: block; animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .prank-text {
    font-size: 40px;
    font-weight: 900;
    color: #e53935;
    line-height: 1.5;
    text-shadow: 2px 2px 0 #ffd54f;
  }
  .prank-emoji { font-size: 60px; margin-bottom: 12px; }
  .confess {
    margin-top: 24px;
    display: inline-block;
    font-size: 26px;
    font-weight: 900;
    color: #fff;
    background: #d32f2f;
    padding: 12px 26px;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(211,47,47,.4);
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .gallery img {
    width: 100%;
    border-radius: 12px;
    display: block;
    aspect-ratio: 3/4;
    object-fit: cover;
    background: #f0f0f0;
  }
  .hello { color: #333; font-size: 18px; margin-bottom: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔮 姓名测试</h1>
    <p class="tip">输入你的姓名，看看会发生什么</p>

    <input id="nameInput" type="text" placeholder="请输入姓名" maxlength="20" autocomplete="off">
    <button onclick="check()">确定</button>

    <div class="result" id="result"></div>
  </div>

<script>
  const TARGET = '赵奕杰';
  // 图片随站点一起托管，保证任何访客都能看到
  const IMAGES = [
    'images/1.jpg', 'images/2.jpg', 'images/3.jpg',
    'images/4.jpg', 'images/5.jpg', 'images/6.jpg'
  ];

  function check() {
    const name = document.getElementById('nameInput').value.trim();
    const box = document.getElementById('result');
    if (!name) { alert('请先输入姓名～'); return; }

    box.classList.remove('show');

    if (name === TARGET) {
      box.innerHTML =
        '<div class="prank-emoji">🤣🤣🤣</div>' +
        '<div class="prank-text">哈哈哈<br>傻逼</div>' +
        '<div><span class="confess">我竟然是日本人</span></div>';
    } else {
      const images = IMAGES
        .map(p => '<img src="' + p + '" alt="美女图片" loading="lazy">')
        .join('');
      box.innerHTML =
        '<div class="hello">你好，' + escapeHtml(name) + ' 👋</div>' +
        '<div class="gallery">' + images + '</div>';
    }

    // 重新触发动画
    void box.offsetWidth;
    box.classList.add('show');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('nameInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') check();
  });
</script>
</body>
</html>
